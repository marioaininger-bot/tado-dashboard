name = "tado-dashboard-api"
main = "tado-api.js"
compatibility_date = "2024-09-01"

# Nach dem Deploy erreichbar unter:
#   https://tado-dashboard-api.<dein-cloudflare-subdomain>.workers.dev
#
# Einmalig einrichten:
#   wrangler kv namespace create TADO_KV
#   -> die zurückgegebene id unten bei [[kv_namespaces]] eintragen
#
# ALLOWED_ORIGIN unten auf deine GitHub-Pages-URL setzen, damit nur
# dein Dashboard die API aufrufen darf (z.B. "https://<user>.github.io").
#
# Deploy:
#   wrangler deploy

[vars]
ALLOWED_ORIGIN = "https://tado.aininger.com"

[[kv_namespaces]]
binding = "TADO_KV"
id = "a564f39df932445aade6b98e9f121036"

# Schreibt alle 5 Minuten einen Messpunkt (Temperatur/Luftfeuchte/Leistung
# je Zone) nach KV, unabhängig davon, ob das Dashboard gerade geöffnet ist.
# Basis für den Verlauf und die Betriebsstunden-Schätzung. Kürzeres Raster
# (z.B. jede Minute) würde das Cloudflare-KV-Schreiblimit im Free-Plan
# sprengen (1000 Writes/Tag - bei 5 Min. sind es ~288/Tag).
[triggers]
crons = ["*/5 * * * *"]
