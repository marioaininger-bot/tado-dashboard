<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Skalenblatt</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
/* Layout: Messblatt – alle Räume auf einer gemeinsamen Temperaturachse, Schweizer Raster, ein Signalton */
:root{
  --bg:#f1f2ee; --paper:#fbfbf9; --ink:#15181b; --dim:#6b7176; --rule:#d5d8d2;
  --heat:#ff5a1f; --cool:#1f6fff; --good:#1f9d63; --warn:#c98a00; --band:#e4ebd9;
  --sans:'Archivo','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --paper:#171a1d; --ink:#eceee9; --dim:#8b9298; --rule:#2b3035; --heat:#ff7440; --cool:#5b97ff; --good:#3fc58a; --warn:#e8b13a; --band:#1f2a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --paper:#171a1d; --ink:#eceee9; --dim:#8b9298; --rule:#2b3035; --heat:#ff7440; --cool:#5b97ff; --good:#3fc58a; --warn:#e8b13a; --band:#1f2a22; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);
  padding-block:24px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:980px;margin:0 auto;background:var(--paper);border:1px solid var(--rule);padding:clamp(16px,3vw,32px)}
.head{display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:end;padding-bottom:18px;border-bottom:3px solid var(--ink)}
.head h1{margin:0;font:800 clamp(30px,6vw,52px)/.95 var(--sans);font-stretch:75%;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.head p{margin:6px 0 0;font:400 12px var(--mono);color:var(--dim)}
.sum{display:flex;gap:24px}
.sum div{text-align:right}.sum small{display:block;font:400 11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.sum b{font:700 28px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.alert{margin:16px 0 0;padding:10px 12px;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);font-size:13px}
.sec{display:grid;grid-template-columns:minmax(120px,190px) 1fr 150px;gap:16px;align-items:end;margin-top:26px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.sec h2{margin:0;font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.axis{position:relative;height:16px;font:400 11px var(--mono);color:var(--dim)}
.axis span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.sec .r{font:400 11px var(--mono);color:var(--dim);text-align:right}
.line{display:grid;grid-template-columns:minmax(120px,190px) 1fr 150px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.nm b{display:block;font-weight:700;font-size:16px}.nm small{font:400 11px var(--mono);color:var(--dim)}
.track{position:relative;height:30px;background:
  linear-gradient(var(--band),var(--band)) no-repeat,var(--bg);
  background-size:calc(var(--bw)*1%) 100%;background-position:calc(var(--bx)*1%) 0}
.track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--rule) calc(10% - 1px) 10%)}
.fill{position:absolute;left:0;top:7px;bottom:7px;background:var(--c);transition:width .3s}
.soll{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);transform:translateX(-1.5px)}
.soll::after{content:attr(data-v);position:absolute;top:-1px;left:7px;font:500 10px var(--mono);color:var(--ink);white-space:nowrap}
.val{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.val b{font:700 30px/1 var(--sans);font-stretch:85%;font-variant-numeric:tabular-nums}
.val span{font:400 11px var(--mono);color:var(--dim);text-align:right;line-height:1.5}
.tag{display:inline-block;margin-top:4px;padding:1px 6px;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor}
.t-heat{color:var(--heat)}.t-warn{color:var(--warn)}.t-win{color:var(--cool)}.t-off{color:var(--dim)}
.sw{display:inline-block;width:40px;height:22px;background:var(--rule);position:relative;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--paper)}
.sw.on{background:var(--cool)}.sw.on::after{left:21px}
.legend{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 22px;font:400 11px var(--mono);color:var(--dim)}
.legend i{display:inline-block;width:12px;height:10px;margin-right:6px;vertical-align:-1px}
@media(max-width:640px){
  .head{grid-template-columns:1fr}.sum div{text-align:left}
  .sec{grid-template-columns:1fr;gap:6px}.sec .r{display:none}.sec h2+.axis{display:block}
  .line{grid-template-columns:1fr;gap:8px}
  .line .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .val{justify-content:flex-start;gap:14px;align-items:center}.val span{text-align:left}
}
</style></head><body>

<div class="sheet">
  <div class="head">
    <div><h1>Raumklima<br>Zuhause</h1><p>Mo, 9.11.2026 · Stand vor 20 s</p></div>
    <div class="sum">
      <div><small>Außen</small><b>6°</b></div>
      <div><small>Ø Innen</small><b>20,5°</b></div>
      <div><small>Heizt</small><b>3 / 6</b></div>
    </div>
  </div>
  <div class="alert">Büro: heizt seit 45 Min., Temperatur steigt nicht. Kinderzimmer: Fenster offen.</div>

  <div class="sec"><h2>Heizung</h2><div class="axis" id="ax1"></div><div class="r">Ist · Soll · Feuchte</div></div>
  <div id="rooms"></div>

  <div class="sec"><h2>Klima</h2><div></div><div class="r"></div></div>
  <div id="ac"></div>

  <div class="legend">
    <span><i style="background:var(--heat)"></i>Balken = Ist-Temperatur</span>
    <span><i style="background:var(--ink);width:3px"></i>Strich = Soll</span>
    <span><i style="background:var(--band)"></i>Komfortbereich 20–22 °C</span>
    <span>Beispieldaten</span>
  </div>
</div>

<script>
const ROOMS=[
 {n:'Wohnzimmer',t:21.4,s:22,h:48,p:70,st:'heat'},
 {n:'Schlafzimmer',t:18.9,s:19,h:55,p:0,st:'idle'},
 {n:'Küche',t:20.2,s:21,h:51,p:40,st:'heat'},
 {n:'Bad',t:23.1,s:23,h:67,p:0,st:'idle'},
 {n:'Büro',t:19.4,s:21,h:44,p:90,st:'warn'},
 {n:'Kinderzimmer',t:20.0,s:20,h:49,p:0,st:'off',win:true}];
const AC=[{n:'Klima Wohnzimmer',on:true,sub:'Kühlen · Ziel 24° · Auto',t:25.1},{n:'Klima Schlafzimmer',on:false,sub:'Aus',t:18.9}];
const MIN=16,MAX=26,P=v=>(v-MIN)/(MAX-MIN)*100,f=v=>v.toFixed(1).replace('.',',');
ax1.innerHTML=[16,18,20,22,24,26].map(v=>`<span style="left:${P(v)}%">${v}°</span>`).join('');
const TAG={heat:['Heizt','t-heat'],warn:['Prüfen','t-warn'],idle:['Ruhig','t-off'],off:['Aus','t-off']};
const track=(t,s,c)=>`<div class="track" style="--bx:${P(20)};--bw:${P(22)-P(20)}"><div class="fill" style="width:${P(t)}%;--c:${c}"></div><div class="soll" style="left:${P(s)}%" data-v="${s}°"></div></div>`;
rooms.innerHTML=ROOMS.map(r=>`<div class="line">
 <div class="nm"><b>${r.n}</b><small>${r.p}% Leistung</small></div>
 ${track(r.t,r.s,r.t<r.s-.5?'var(--heat)':'var(--good)')}
 <div class="val"><b>${f(r.t)}°</b><span>Soll ${r.s}°<br>${r.h} % rF<br><span class="tag ${TAG[r.st][1]}">${TAG[r.st][0]}</span>${r.win?' <span class="tag t-win">Fenster</span>':''}</span></div></div>`).join('');
ac.innerHTML=AC.map(a=>`<div class="line">
 <div class="nm"><b>${a.n}</b><small>${a.sub}</small></div>
 <div></div>
 <div class="val"><b>${f(a.t)}°</b><span class="sw ${a.on?'on':''}"></span></div></div>`).join('');
</script>
</body></html>
