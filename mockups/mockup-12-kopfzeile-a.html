<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup 12A – Kopfzeile: runde Icon-Knöpfe + Stand-Pille mit Ring</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* A: Strom und Abmelden als runde Icon-Knöpfe, Stand als Pille mit Alterungs-Ring (füllt sich bis zum nächsten Refresh) */
:root{--bg:#f2f1ed;--card:#fff;--text:#1b1b1f;--dim:#76767f;--blue:#2c8fd6;--green:#3ea86a;--red:#e04f38;--orange:#ff7a3d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}
.logo{font-weight:800;font-size:19px;color:var(--dim)}.logo b{color:var(--text)}.logo span{color:var(--blue)}
.act{display:flex;gap:8px;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--dim);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 #0000000a,0 2px 8px #0000000f}
.ib:hover{color:var(--text)}.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.strom{color:var(--orange)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 2px 18px}
h2{margin:0;font-size:28px;letter-spacing:-.02em}.sub{color:var(--dim);font-size:14px;margin-top:4px}
.stand{display:inline-flex;align-items:center;gap:9px;margin-top:4px;background:var(--card);border:0;border-radius:999px;padding:5px 14px 5px 6px;font:inherit;font-size:12.5px;color:var(--dim);cursor:pointer;box-shadow:0 1px 0 #0000000a,0 2px 8px #0000000f}
.stand .ring{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text);font-size:14px;background:conic-gradient(var(--green) 0 62%,#e6e3dc 0)}
.stand .ring i{width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
.stand b{color:var(--text);font-weight:600}
.stand.stale .ring{background:conic-gradient(var(--red) 0 100%,#e6e3dc 0)}.stand.stale{color:#c0341f}
.cap{margin-top:26px;font-size:13px;color:var(--dim);line-height:1.6}
.card{background:var(--card);border-radius:26px;height:120px;box-shadow:0 8px 24px #0000000d;margin-top:14px}
</style></head><body><div class="wrap">
<div class="hero">
  <div><button class="ib strom" title="Strom" aria-label="Strom"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button></div>
  <div class="logo"><b>tado</b><span>°</span></div>
  <div class="act"><button class="ib" title="Abmelden" aria-label="Abmelden"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
</div>
<div class="row"><div><h2>Guten Morgen 👋</h2><div class="sub">Alles im grünen Bereich</div></div>
  <button class="stand"><span class="ring"><i>↻</i></span><span>Stand <b>09:42</b></span></button></div>
<div class="card"></div><div class="card"></div>
<div class="cap"><b>Variante A:</b> Strom (orange Blitz) links, Abmelden rechts als reines Icon – spart Platz, Logo bleibt mittig. Der Stand-Knopf hat einen Ring, der anzeigt, wie alt die Daten sind; bei „veraltet“ wird er rot und voll.</div>
</div></body></html>
