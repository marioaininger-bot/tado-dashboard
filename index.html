<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌡️ Tado Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#f4f6fb;
    --bg-2:#e8ecf5;
    --card:#ffffff;
    --card-border:#dde3ee;
    --text:#1c2333;
    --text-dim:#63708a;
    --orange:#e8873b;
    --blue:#2c8fd6;
    --green:#3ea86a;
    --red:#e04f38;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    min-height:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px;}

  .hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:8px;margin-bottom:14px;}
  .tado-logo{
    justify-self:center;font-weight:800;font-size:19px;letter-spacing:.3px;
    color:var(--text-dim);user-select:none;
  }
  .tado-logo b{color:var(--text);font-weight:800;}
  .tado-logo .ring{color:var(--blue);font-weight:800;}
  .hero .icon-btn{justify-self:end;}
  .icon-btn{
    background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);
    padding:9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--blue);}

  .weather-strip{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;
    background:var(--card);border:1px solid var(--card-border);border-radius:16px;
    padding:14px 20px;margin-bottom:22px;color:var(--text-dim);font-size:14px;
  }
  .weather-strip b{color:var(--text);font-size:16px;}

  .forecast-row{
    display:flex;gap:10px;overflow-x:auto;margin-bottom:22px;padding-bottom:10px;
    scrollbar-width:thin;scrollbar-color:var(--card-border) transparent;
  }
  .forecast-row::-webkit-scrollbar{height:6px;}
  .forecast-row::-webkit-scrollbar-track{background:transparent;}
  .forecast-row::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:999px;}
  .forecast-row::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
  .forecast-chip{
    flex:0 0 auto;min-width:56px;text-align:center;
    background:var(--card);border:1px solid var(--card-border);border-radius:12px;
    padding:8px 10px;color:var(--text-dim);font-size:12px;
  }
  .forecast-chip .fc-temp{color:var(--text);font-weight:700;font-size:14px;margin:2px 0;}
  .forecast-chip .fc-rain{color:var(--blue);}
  .day-divider{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
    border-left:1px dashed var(--card-border);padding:0 12px;
    align-self:stretch;
  }

  .zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .zone-card{
    background:linear-gradient(180deg,var(--card),#f7f9fc);
    border:1px solid var(--card-border);border-radius:18px;padding:18px;
    box-shadow:0 1px 3px rgba(28,35,51,.06);
    position:relative;overflow:hidden;
  }
  .zone-card.open-window{border-color:var(--red);}
  .zone-card.clickable{cursor:pointer;}
  .zone-card.clickable:hover{border-color:var(--blue);}
  .zone-card .type-badge{
    position:absolute;top:14px;right:16px;font-size:22px;opacity:.85;
  }
  .zone-card h3{margin:0 0 14px;font-size:16px;padding-right:32px;}
  .temp-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .temp-row .current{font-size:34px;font-weight:800;}
  .temp-row .target{color:var(--text-dim);font-size:14px;}
  .meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;color:var(--text-dim);font-size:13px;margin-bottom:12px;}
  .power-bar-track{background:#e7ebf3;border-radius:999px;height:8px;overflow:hidden;}
  .power-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--orange),#ffd08a);transition:width .4s ease;}
  .zone-card.type-AC .power-bar-fill{background:linear-gradient(90deg,var(--blue),#bfe6ff);}
  .power-label{color:var(--text-dim);font-size:12px;margin-top:6px;}
  .off-chip{
    display:inline-block;background:#eef1f8;border:1px solid var(--card-border);
    color:var(--text-dim);font-size:12px;padding:3px 10px;border-radius:999px;margin-top:4px;
  }
  .warn-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#fdecea;border:1px solid var(--red);color:#b8291a;
    font-size:12px;padding:4px 10px;border-radius:999px;margin-top:10px;
  }
  .stagnant-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#fdf1e4;border:1px solid var(--orange);color:#8a5417;
    font-size:12px;padding:4px 10px;border-radius:999px;margin-top:10px;
  }
  .runtime-label{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .next-change-inline{white-space:nowrap;}
  .battery-icon{font-size:14px;line-height:1;}

  .zone-controls{
    display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--card-border);
  }
  .temp-btn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--card-border);
    background:var(--card);color:var(--text);font-size:16px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;line-height:1;padding:0;
  }
  .temp-btn:hover{border-color:var(--orange);color:var(--orange);}
  .temp-btn:disabled{opacity:.5;cursor:not-allowed;}
  .temp-display{font-weight:700;font-size:14px;min-width:38px;text-align:center;font-variant-numeric:tabular-nums;}
  .resume-link{
    margin-left:auto;background:none;border:none;color:var(--blue);font-size:12px;
    text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;
  }
  .resume-link:disabled{opacity:.5;cursor:not-allowed;}

  .history{margin:12px 0 2px;padding-top:11px;border-top:1px dashed var(--card-border);}
  .history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .history-head .label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-dim);font-weight:700;
  }
  .history-head svg{display:block;}
  .history-table{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px 10px;font-size:12.5px;}
  .history-row{display:contents;}
  .history-col-label{color:var(--text-dim);font-size:10px;padding-bottom:2px;}
  .history-col-label.num{text-align:right;}
  .h-time{color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .h-temp,.h-hum{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-dim);}
  .h-temp b{color:var(--text);font-weight:700;}
  .history-row.now .h-time{color:var(--text);font-weight:700;}
  .history-row.now .h-temp b,.history-row.now .h-hum{color:var(--text);font-weight:800;}
  .trend{font-size:10px;margin-left:3px;}
  .trend.up{color:var(--orange);}
  .trend.down{color:var(--blue);}
  .trend.flat{color:var(--text-dim);}

  /* Login-Screen */
  #loginScreen{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:var(--card);border:1px solid var(--card-border);border-radius:20px;
    padding:40px 24px;margin-top:40px;gap:16px;
  }
  #loginScreen h2{margin:0;font-size:22px;}
  #loginScreen p{color:var(--text-dim);margin:0;max-width:420px;line-height:1.5;}
  .code-box{
    font-family:monospace;font-size:32px;letter-spacing:6px;
    background:#eef1f8;border:1px solid var(--card-border);border-radius:14px;
    padding:14px 24px;margin:6px 0;color:var(--orange);
  }
  .btn-primary{
    background:linear-gradient(90deg,var(--orange),#ffd08a);color:#241a03;
    border:none;padding:13px 24px;border-radius:14px;font-weight:700;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-link{
    background:none;border:none;color:var(--blue);text-decoration:underline;
    cursor:pointer;font-family:inherit;font-size:14px;
  }
  .status-line{color:var(--text-dim);font-size:13px;min-height:18px;}

  .empty-state{text-align:center;color:var(--text-dim);padding:40px 0;}
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--card-border);border-top-color:var(--orange);
    animation:spin .8s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:480px){
    .wrap{padding:24px 16px 50px;}
    .code-box{font-size:24px;letter-spacing:4px;padding:12px 16px;}
    #loginScreen{padding:32px 18px;}
    .zone-grid{grid-template-columns:1fr;}
  }

  /* Tablets im Querformat (iPad & ähnlich): mehr Breite nutzen, damit
     mehr Kacheln pro Zeile passen und man nicht scrollen muss. */
  @media (min-width:820px){
    .wrap{max-width:1180px;}
    .zone-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
    .zone-card{padding:15px;}
    .zone-card h3{margin:0 0 10px;font-size:15px;}
    .temp-row .current{font-size:28px;}
    .meta-row{margin-bottom:9px;}
  }

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,24,36,.45);
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-card{
    background:var(--card);border-radius:18px;padding:20px;
    max-width:420px;width:100%;max-height:85vh;overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{
    background:none;border:none;color:var(--text-dim);font-size:20px;
    cursor:pointer;line-height:1;padding:4px;font-family:inherit;
  }
  .modal-close:hover{color:var(--text);}
  .chart-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-dim);font-weight:700;margin:16px 0 4px;
  }
  .chart-label:first-of-type{margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span></span>
    <div class="tado-logo"><b>tado</b><span class="ring">°</span></div>
    <button class="icon-btn" id="logoutBtn" style="display:none;">Abmelden</button>
  </div>

  <div id="weatherStrip" class="weather-strip" style="display:none;"></div>
  <div id="forecastRow" class="forecast-row" style="display:none;"></div>

  <div id="loginScreen" style="display:none;">
    <h2>Mit Tado verbinden</h2>
    <p>Klicke auf „Verbinden“, öffne die Tado-Seite und bestätige dort mit deinem Tado-Login. Danach lädt sich das Dashboard automatisch.</p>
    <button class="btn-primary" id="connectBtn">Verbinden</button>
    <div id="deviceCodeBox" style="display:none;">
      <div class="code-box" id="userCode">----</div>
      <a class="btn-link" id="verifyLink" href="#" target="_blank" rel="noopener">Tado-Seite öffnen</a>
      <p class="status-line" id="pollStatus">Warte auf Bestätigung …</p>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div id="zoneGrid" class="zone-grid"></div>
  </div>

  <div id="loadingState" class="empty-state" style="display:none;">
    <div class="spinner"></div>
    Lade Zonen …
  </div>

  <div id="dayChartModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="dayChartTitle"></h3>
        <button class="modal-close" id="dayChartClose" aria-label="Schließen">✕</button>
      </div>
      <div id="dayChartBody"></div>
    </div>
  </div>

</div>

<script>
// URL des Cloudflare Workers (tado-api.js). Nach `wrangler deploy` hier
// eintragen, z.B. https://tado-dashboard-api.mario-aininger.workers.dev
const API_ENDPOINT = 'https://tado-dashboard-api.mario-aininger.workers.dev';

function zoneIcon(zone) {
  const isOff = zone.power === 'OFF';
  if (zone.type === 'AC') {
    const cooling = typeof zone.acPower === 'number' ? zone.acPower > 0 : zone.acPower === 'ON';
    return !isOff && cooling ? '❄️' : '🌬️';
  }
  if (zone.type === 'HOT_WATER') {
    return !isOff && zone.heatingPower > 0 ? '🔥' : '💧';
  }
  // HEATING
  return !isOff && zone.heatingPower > 0 ? '🔥' : '🌡️';
}
const WEATHER_ICONS = {
  NIGHT_CLEAR: '🌙', SUN: '☀️', CLOUDY: '☁️', CLOUDY_PARTLY: '⛅',
  CLOUDY_MOSTLY: '🌥️', SCATTERED_SHOWERS: '🌦️', DRIZZLE: '🌧️',
  RAIN: '🌧️', SNOW: '🌨️', FOGGY: '🌫️', THUNDERSTORM: '⛈️',
};

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loadingState = document.getElementById('loadingState');
const weatherStrip = document.getElementById('weatherStrip');
const forecastRow = document.getElementById('forecastRow');
const logoutBtn = document.getElementById('logoutBtn');
const zoneGrid = document.getElementById('zoneGrid');

async function api(path, options) {
  const res = await fetch(API_ENDPOINT + path, options);
  return res.json();
}

function show(el, visible, display) {
  el.style.display = visible ? (display || 'block') : 'none';
}

async function init() {
  try {
    const status = await api('/api/auth/status');
    if (status.loggedIn) {
      startDashboard();
    } else {
      show(loginScreen, true, 'flex');
    }
  } catch (e) {
    show(loginScreen, true, 'flex');
  }
}

/* ---------- Login (Device Code Flow) ---------- */
let pollTimer = null;

document.getElementById('connectBtn').addEventListener('click', async () => {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  try {
    const data = await api('/api/auth/start', { method: 'POST' });
    if (!data.user_code) throw new Error(data.error || 'Login konnte nicht gestartet werden.');

    document.getElementById('userCode').textContent = data.user_code;
    const link = document.getElementById('verifyLink');
    link.href = data.verification_uri_complete || data.verification_uri;
    show(document.getElementById('deviceCodeBox'), true, 'block');

    const intervalMs = (data.interval || 5) * 1000;
    pollTimer = setInterval(() => pollAuth(data.device_code), intervalMs);
  } catch (e) {
    show(document.getElementById('deviceCodeBox'), true, 'block');
    document.getElementById('userCode').textContent = '----';
    document.getElementById('pollStatus').textContent = 'Fehler: ' + e.message;
    btn.disabled = false;
  }
});

async function pollAuth(deviceCode) {
  const statusEl = document.getElementById('pollStatus');
  try {
    const data = await api('/api/auth/poll', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_code: deviceCode }),
    });
    if (data.status === 'success') {
      clearInterval(pollTimer);
      statusEl.textContent = 'Verbunden!';
      startDashboard();
    } else if (data.status === 'error') {
      clearInterval(pollTimer);
      statusEl.textContent = 'Fehler: ' + data.error;
      document.getElementById('connectBtn').disabled = false;
    } else {
      statusEl.textContent = 'Warte auf Bestätigung …';
    }
  } catch (e) {
    statusEl.textContent = 'Verbindungsfehler, versuche es weiter …';
  }
}

logoutBtn.addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  show(dashboard, false);
  show(weatherStrip, false);
  show(forecastRow, false);
  show(logoutBtn, false);
  show(loginScreen, true, 'flex');
  document.getElementById('deviceCodeBox').style.display = 'none';
  document.getElementById('connectBtn').disabled = false;
});

/* ---------- Dashboard ---------- */
let refreshTimer = null;

function startDashboard() {
  show(loginScreen, false);
  show(logoutBtn, true, 'inline-block');
  show(loadingState, true, 'block');
  loadDashboard();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadDashboard, 60000);
}

async function loadDashboard() {
  try {
    const data = await api('/api/dashboard');
    if (data.error) throw new Error(data.error);

    renderWeather(data.weather);
    renderZones(data.zones || []);

    show(loadingState, false);
    show(dashboard, true, 'block');
  } catch (e) {
    loadingState.innerHTML = `<p>Konnte Daten nicht laden: ${e.message}</p>`;
    show(loadingState, true, 'block');
    show(dashboard, false);
  }
}

function renderWeather(weather) {
  if (!weather) { show(weatherStrip, false); show(forecastRow, false); return; }
  const icon = WEATHER_ICONS[weather.state] || '🌡️';
  weatherStrip.innerHTML = `
    <span style="font-size:26px;">${icon}</span>
    <span>Außen: <b>${weather.outsideTemp != null ? weather.outsideTemp.toFixed(1) + '°C' : '–'}</b></span>
    <span>Sonne: <b>${weather.solarIntensity != null ? Math.round(weather.solarIntensity) + '%' : '–'}</b></span>
    ${weather.humidity != null ? `<span>Luftfeuchte: <b>${Math.round(weather.humidity)}%</b></span>` : ''}
    ${weather.windSpeed != null ? `<span>Wind: <b>${Math.round(weather.windSpeed)} km/h</b></span>` : ''}
  `;
  show(weatherStrip, true, 'flex');

  if (weather.hourly && weather.hourly.length) {
    forecastRow.innerHTML = weather.hourly.map((h) => `
      ${h.newDay ? '<div class="day-divider">Morgen</div>' : ''}
      <div class="forecast-chip">
        <div>${h.time}</div>
        <div class="fc-temp">${h.temp != null ? Math.round(h.temp) + '°' : '–'}</div>
        <div class="fc-rain">${h.rainChance != null ? '🌧️' + h.rainChance + '%' : ''}</div>
      </div>
    `).join('');
    show(forecastRow, true, 'flex');
  } else {
    show(forecastRow, false);
  }
}

function trendArrow(diff) {
  if (diff > 0.05) return '<span class="trend up">▲</span>';
  if (diff < -0.05) return '<span class="trend down">▼</span>';
  return '<span class="trend flat">–</span>';
}

function historySparkline(history) {
  const temps = history.map((h) => h.temp).filter((t) => t != null);
  if (temps.length < 2) return '';
  const min = Math.min(...temps), max = Math.max(...temps);
  const span = Math.max(max - min, 0.3);
  const w = 56, h = 18, pad = 2;
  const pts = temps.map((t, i) => {
    const x = pad + (i / (temps.length - 1)) * (w - pad * 2);
    const y = h - pad - ((t - min) / span) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p) => p.join(',')).join(' ');
  const area = `${pad},${h} ${line} ${w - pad},${h}`;
  const last = pts[pts.length - 1];
  const rising = temps[temps.length - 1] >= temps[0];
  const stroke = rising ? 'var(--orange)' : 'var(--blue)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="${stroke}" opacity="0.15"></polygon>
    <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${stroke}"></circle>
  </svg>`;
}

function historyRows(history) {
  return history.map((point, i) => {
    const time = new Date(point.t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
    const diff = i === 0 ? 0 : point.temp - history[i - 1].temp;
    const arrow = i === 0 ? '' : trendArrow(diff);
    const isNow = i === history.length - 1;
    const temp = point.temp != null ? point.temp.toFixed(1) + '°' : '–';
    const humidity = point.humidity != null ? Math.round(point.humidity) + '%' : '–';
    return `<div class="history-row ${isNow ? 'now' : ''}">
      <span class="h-time">${time}</span>
      <span class="h-temp"><b>${temp}</b>${arrow}</span>
      <span class="h-hum">${humidity}</span>
    </div>`;
  }).join('');
}

// Wählt aus der fein aufgezeichneten Historie (alle 5 Minuten) die Punkte
// auf vollen Viertelstunden (:00/:15/:30/:45) aus, damit die Kachel echte
// Uhrzeiten zeigt statt Zeiten relativ zum letzten Datenpunkt (die je nach
// Abrufzeitpunkt z.B. 19:10/19:25/19:40 wären statt 19:15/19:30/19:45). Die
// Betriebsstunden-Schätzung nutzt weiterhin die volle 5-Minuten-Historie.
function selectQuarterHourPoints(history, count) {
  if (!history || !history.length) return [];
  const onQuarter = history.filter((p) => new Date(p.t).getUTCMinutes() % 15 === 0);
  const source = onQuarter.length >= 2 ? onQuarter : history;
  return source.slice(-count);
}

function historyHtml(history) {
  if (!history || history.length < 2) return '';
  return `
    <div class="history">
      <div class="history-head">
        <span class="label">Verlauf · 15 Min</span>
        ${historySparkline(history)}
      </div>
      <div class="history-table">
        <span class="history-col-label">Zeit</span>
        <span class="history-col-label num">Temp.</span>
        <span class="history-col-label num">Feuchte</span>
        ${historyRows(history)}
      </div>
    </div>
  `;
}

// Warnt, wenn eine Zone seit min. 30 Min. aktiv heizt/kühlt, ohne dass sich
// die Temperatur Richtung Ziel bewegt - möglicher Hinweis auf ein
// klemmendes Ventil, ein offenes Fenster (das Tado nicht erkannt hat) o.ä.
// Schaut auf ein festes Zeitfenster (nicht eine feste Anzahl Punkte)
// zurück, damit das Ergebnis unabhängig vom Aufzeichnungsraster des
// Workers bleibt (aktuell alle 5 Minuten, war mal 15).
const STAGNATION_WINDOW_MINUTES = 30;

function isStagnant(zone) {
  if (!zone.history || zone.history.length < 2) return false;
  if (zone.power === 'OFF' || zone.openWindow) return false;
  if (zone.currentTemp == null || zone.targetTemp == null) return false;

  const powerPct = zone.type === 'AC'
    ? (typeof zone.acPower === 'number' ? zone.acPower : (zone.acPower === 'ON' ? 100 : 0))
    : (zone.heatingPower || 0);
  if (powerPct < 50) return false;

  // Schon nah am Ziel: normales Plateau, kein Alarm.
  const gap = zone.type === 'AC'
    ? zone.currentTemp - zone.targetTemp // Kühlen: Ist über Ziel
    : zone.targetTemp - zone.currentTemp; // Heizen: Ist unter Ziel
  if (gap < 0.3) return false;

  const latestTime = new Date(zone.history[zone.history.length - 1].t).getTime();
  const windowMs = STAGNATION_WINDOW_MINUTES * 60 * 1000;
  const windowPoints = zone.history.filter((p) => latestTime - new Date(p.t).getTime() <= windowMs);
  if (windowPoints.length < 2 || windowPoints.some((p) => p.temp == null)) return false;

  const delta = windowPoints[windowPoints.length - 1].temp - windowPoints[0].temp;
  const improving = zone.type === 'AC' ? delta < -0.1 : delta > 0.1;
  return !improving;
}

// Schätzt aus dem Verlauf (Leistung je Messpunkt), wie viele Stunden eine
// Zone im aufgezeichneten Zeitraum "voll aktiv" geheizt/gekühlt hätte -
// keine echte kWh-Angabe (Tado liefert keine Wattzahlen), nur eine grobe
// Laufzeit-Schätzung.
function runtimeStats(history) {
  if (!history || history.length < 2) return null;
  let minutesActive = 0;
  for (let i = 1; i < history.length; i++) {
    const t0 = new Date(history[i - 1].t).getTime();
    const t1 = new Date(history[i].t).getTime();
    const deltaMin = Math.min((t1 - t0) / 60000, 30); // Lücken kappen
    if (deltaMin <= 0) continue;
    const p0 = history[i - 1].power || 0;
    const p1 = history[i].power || 0;
    minutesActive += deltaMin * ((p0 + p1) / 2 / 100);
  }
  const spanHours = (new Date(history[history.length - 1].t) - new Date(history[0].t)) / 3600000;
  return { hours: minutesActive / 60, spanHours };
}

function runtimeHtml(history) {
  const stats = runtimeStats(history);
  if (!stats || stats.spanHours < 0.25) return '';
  const period = stats.spanHours < 1
    ? `${Math.round(stats.spanHours * 60)} Min.`
    : `${stats.spanHours.toFixed(1)}h`;
  return `<div class="runtime-label">🔥 ${stats.hours.toFixed(1)}h aktiv (letzte ${period})</div>`;
}

function renderZones(zones) {
  currentZones = zones;
  if (!zones.length) {
    zoneGrid.innerHTML = '<div class="empty-state">Keine Zonen gefunden.</div>';
    return;
  }
  zoneGrid.innerHTML = zones.map(zoneCardHtml).join('');
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
}

function nextChangeHtml(zone) {
  const next = zone.nextScheduleChange;
  if (!next || !next.start) return '';
  const value = next.power === 'OFF' ? 'Aus' : (next.temperature != null ? next.temperature.toFixed(1) + '°' : '–');
  return `<span class="next-change-inline" title="Nächste geplante Änderung">🕒 ${formatTime(next.start)} → ${value}</span>`;
}

function batteryIconHtml(zone) {
  if (!zone.hasBatteryInfo) return '';
  return zone.batteryLow
    ? '<span class="battery-icon" title="Batterie schwach">🪫</span>'
    : '<span class="battery-icon" title="Batterie normal">🔋</span>';
}

function controlsHtml(zone) {
  if (zone.type !== 'HEATING') return '';
  const base = zone.targetTemp != null
    ? zone.targetTemp
    : (zone.currentTemp != null ? Math.round(zone.currentTemp * 2) / 2 : 20);
  return `
    <div class="zone-controls">
      <button class="temp-btn" data-action="dec" data-zone-id="${zone.id}" data-temp="${base}" aria-label="Kälter">−</button>
      <span class="temp-display">${base.toFixed(1)}°</span>
      <button class="temp-btn" data-action="inc" data-zone-id="${zone.id}" data-temp="${base}" aria-label="Wärmer">+</button>
      ${zone.manualOverride ? `<button class="resume-link" data-action="resume" data-zone-id="${zone.id}">Zeitplan</button>` : ''}
    </div>
  `;
}

function zoneCardHtml(zone) {
  const icon = zoneIcon(zone);
  const isOff = zone.power === 'OFF';
  const powerPct = zone.type === 'AC'
    ? (typeof zone.acPower === 'number' ? zone.acPower : (zone.acPower === 'ON' ? 100 : 0))
    : (zone.heatingPower || 0);

  const current = zone.currentTemp != null ? zone.currentTemp.toFixed(1) + '°' : '–';
  const target = zone.targetTemp != null ? 'Ziel ' + zone.targetTemp.toFixed(1) + '°' : '';
  const humidity = zone.humidity != null ? Math.round(zone.humidity) + '% Luftfeuchte' : '';
  const hasChart = zone.history && zone.history.length >= 2;

  const metaItems = [
    humidity ? `<span>${humidity}</span>` : '',
    nextChangeHtml(zone),
    batteryIconHtml(zone),
  ].filter(Boolean).join('');

  return `
    <div class="zone-card type-${zone.type || ''} ${zone.openWindow ? 'open-window' : ''} ${hasChart ? 'clickable' : ''}" data-zone-id="${zone.id}">
      <span class="type-badge">${icon}</span>
      <h3>${zone.name}</h3>
      ${isOff ? `
        <div class="temp-row"><span class="current">${current}</span></div>
        <span class="off-chip">Ausgeschaltet</span>
      ` : `
        <div class="temp-row">
          <span class="current">${current}</span>
          <span class="target">${target}</span>
        </div>
      `}
      ${metaItems ? `<div class="meta-row">${metaItems}</div>` : ''}
      ${!isOff ? `
        <div class="power-bar-track"><div class="power-bar-fill" style="width:${powerPct}%"></div></div>
        <div class="power-label">${Math.round(powerPct)}% Leistung</div>
      ` : ''}
      ${runtimeHtml(zone.history)}
      ${zone.openWindow ? '<div class="warn-chip">🪟 Fenster offen erkannt</div>' : ''}
      ${zone.deviceOffline ? '<div class="warn-chip">📡 Gerät offline</div>' : ''}
      ${isStagnant(zone) ? '<div class="stagnant-chip">⚠️ Reagiert nicht wie erwartet</div>' : ''}
      ${controlsHtml(zone)}
      ${historyHtml(selectQuarterHourPoints(zone.history, 3))}
    </div>
  `;
}

/* ---------- Tages-Chart (Modal) ---------- */
let currentZones = [];
const dayChartModal = document.getElementById('dayChartModal');

function dayChartSvg(history, key, color, unit) {
  const points = history.filter((p) => p[key] != null);
  if (points.length < 2) return '<p class="status-line">Keine Daten.</p>';

  const vals = points.map((p) => p[key]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = Math.max(max - min, key === 'temp' ? 0.5 : 2);
  const w = 300, h = 72, padL = 30, padR = 6, padT = 8, padB = 16;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  const coords = points.map((p, i) => ({
    x: padL + (i / (points.length - 1)) * plotW,
    y: padT + plotH - ((p[key] - min) / span) * plotH,
  }));
  const line = coords.map((c) => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const area = `${coords[0].x.toFixed(1)},${(padT + plotH).toFixed(1)} ${line} ${coords[coords.length - 1].x.toFixed(1)},${(padT + plotH).toFixed(1)}`;

  const fmtTime = (t) => new Date(t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
  const first = fmtTime(points[0].t);
  const last = fmtTime(points[points.length - 1].t);
  const mid = fmtTime(points[Math.floor(points.length / 2)].t);

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="var(--card-border)" stroke-width="1"/>
    <line x1="${padL}" y1="${padT + plotH}" x2="${w - padR}" y2="${padT + plotH}" stroke="var(--card-border)" stroke-width="1"/>
    <text x="0" y="${padT + 6}" font-size="8" fill="var(--text-dim)">${max.toFixed(1)}${unit}</text>
    <text x="0" y="${padT + plotH}" font-size="8" fill="var(--text-dim)">${min.toFixed(1)}${unit}</text>
    <polygon points="${area}" fill="${color}" opacity="0.15"></polygon>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <text x="${padL}" y="${h - 3}" font-size="8" fill="var(--text-dim)" text-anchor="start">${first}</text>
    <text x="${padL + plotW / 2}" y="${h - 3}" font-size="8" fill="var(--text-dim)" text-anchor="middle">${mid}</text>
    <text x="${w - padR}" y="${h - 3}" font-size="8" fill="var(--text-dim)" text-anchor="end">${last}</text>
  </svg>`;
}

function openDayChart(zone) {
  document.getElementById('dayChartTitle').textContent = zone.name;
  document.getElementById('dayChartBody').innerHTML = `
    <div class="chart-label">Temperatur (${zone.history.length} Messpunkte)</div>
    ${dayChartSvg(zone.history, 'temp', 'var(--orange)', '°')}
    <div class="chart-label">Luftfeuchte</div>
    ${dayChartSvg(zone.history, 'humidity', 'var(--blue)', '%')}
  `;
  dayChartModal.style.display = 'flex';
}

function closeDayChart() {
  dayChartModal.style.display = 'none';
}

/* ---------- Zonensteuerung (Temperatur setzen / Zeitplan fortsetzen) ---------- */
async function setZoneTemp(zoneId, temperature, btn) {
  if (btn) btn.disabled = true;
  try {
    const res = await api('/api/zones/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zoneId, temperature }),
    });
    if (res.error) throw new Error(res.error);
    await loadDashboard();
  } catch (e) {
    alert('Konnte Temperatur nicht setzen: ' + e.message);
    if (btn) btn.disabled = false;
  }
}

async function resumeZoneSchedule(zoneId, btn) {
  if (btn) btn.disabled = true;
  try {
    const res = await api('/api/zones/resume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zoneId }),
    });
    if (res.error) throw new Error(res.error);
    await loadDashboard();
  } catch (e) {
    alert('Konnte Zeitplan nicht fortsetzen: ' + e.message);
    if (btn) btn.disabled = false;
  }
}

zoneGrid.addEventListener('click', (e) => {
  const controlBtn = e.target.closest('[data-action]');
  if (controlBtn) {
    const zoneId = controlBtn.dataset.zoneId;
    const action = controlBtn.dataset.action;
    if (action === 'resume') {
      resumeZoneSchedule(zoneId, controlBtn);
    } else {
      const current = parseFloat(controlBtn.dataset.temp);
      const next = Math.round((action === 'inc' ? current + 0.5 : current - 0.5) * 2) / 2;
      setZoneTemp(zoneId, next, controlBtn);
    }
    return;
  }

  const card = e.target.closest('.zone-card');
  if (!card) return;
  const zone = currentZones.find((z) => String(z.id) === card.dataset.zoneId);
  if (zone && zone.history && zone.history.length >= 2) openDayChart(zone);
});
document.getElementById('dayChartClose').addEventListener('click', closeDayChart);
dayChartModal.addEventListener('click', (e) => {
  if (e.target === dayChartModal) closeDayChart();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDayChart();
});

init();
</script>
</body>
</html>
